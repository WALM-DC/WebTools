<html>
<head>
    <title>Price-Checker</title>
    <link rel="stylesheet" href="data/mattStyle.css">
    <script src="https://walm-dc.github.io/WebTools/public/jquery-3.7.1.min.js"></script>
    <script src="https://walm-dc.github.io/WebTools/public/ddtf.js"></script>
    <script src="data/mattQuery.js"></script>
    <style>
        html {
            scroll-padding-top: 30px;
        }
        html, body {
            overflow: auto;
        }
        .resultDiv {
            width: 100%;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 14px;
            min-height: 400px;
        }
        select {
            width: auto;
            min-width: 340px;
            height: 340px;
            overflow: auto;
        }
        option {
            cursor: pointer;
        }
        table{
            max-width: 1920px;
        }
        table tr:hover td {
            border: 1px solid black;
            box-shadow: 5px 0px 6px 0px yellow;
            background: rgb(255 255 255 / 60%);
        }
        table td,
        table th {
            border: 1px solid #dddddd;
            padding: 5px;
            text-align: left;
            max-width: unset;
            align-content: flex-start;
        }
        table tr.subEntry>th,
        table tr.subEntry>td:nth-child(1n + 2) {
            padding-left: 20px;
        }
        .innerTable {
            width: 100%;
        }
        tr.match {
            background-color: lightgreen;
        }
        tr.noMatch {
            background-color: darksalmon;
        }
        tr.belongsToMatch {
            background-color: khaki;
        }
        tr.empty {
            background-color: lightblue;
        }
        .clickMe {
            cursor: pointer;
            background-color: darkorange;
            text-align: center;
            border-radius: 7px;
        }
        .clickMe:hover {
            color: white;
            background-color: darkcyan;
        }
        .selectDiv {
            display: flex;
            justify-content: center;
            position: relative;
            padding-top: 12px;
        }
        .selectDiv div {
            padding: 0 7px;
        }
        .hideMe {
            display: none;
        }
        .loading {
            background-image: url(loading.gif);
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .errorDiv {
            display: flex;
            justify-content: center;
        }
        #errorList {
            color: yellow;
            text-align: left;
            max-width: 1200px;
            line-height: 20px;
        }
        #errorList span {
            font-weight: bold;
            color: orange;
        }
        #errorList a:hover {
            color: rosybrown;
        }

        #errorList a,
        #errorList a:visited {
            color: darksalmon
        }
        #errorList span.noErrors {
            color: lightgreen;
            font-weight: bold;
        }
        #errorList span.bigError {
            /* color: orangered; */
            background-color: #334;
            padding: 0px 1px;
            border-radius: 5px;
        }
        #errorList .targetComparison {
            display: flex;
        }
        #errorList .targetComparison table {
            margin-bottom: auto;
        }
        input[type=file]{
            display: none;
        }
        .custom-file-upload{
            margin-bottom: 158px;
        }
        @media (min-width: 768px) {
            .custom-file-upload, button {
                font-size: 18px;
                min-width: 260px;
            }
        }
    </style>
</head>

                    </form>
                </div>
                <div>
                    <h3 for="xmlFirstSelect">ICOM:</h3>

                <div>

                </div>
                <div class="resultDiv">

                </div>
            </div>
        </div>
    </div>

    function waitForXMLToLoad() {
        function isFilled(obj) {
            return obj && typeof obj === 'object' && Object.keys(obj).length > 0;
        }

        const intervalId = setInterval(() => {
            if (isFilled(secondXML)) {
                console.log('Objects is filled. Stopping interval.');
                clearInterval(intervalId);
                checkAndCompareTables();
                $('.resultDiv').removeClass('loading');
            } else {
                console.log('Waiting... secondXML filled:', isFilled(secondXML));
            }
        }, 1000);
    }

    function readXML(fileName) {
        if(noSecondXML){
            secondXMLDataVersion = firstXMLDataVersion;
            secondXMLSerieNo = firstXMLSerieNo;
            secondXMLCatalogID = firstXMLCatalogID;
            secondXML = firstXML;
            checkAndCompareTables();
        } else {
            var xmlPath = 'https://ig-creator.xxxlgroup.com/idm/' + fileName + '.xml';
            $('#tableNew').empty();
            $.ajax({
                type: "GET",
                url: xmlPath,
                dataType: "xml",

                error: function (e) {
                    alert("An error occurred while processing XML file");
                    console.log("XML reading Failed: ", e);
                },

                success: function (response) {
                    processXMLs(response, tableID);
                }
            })
        }
    }

    $('#jsonFiles').change(function () {
        const files = Array.from(this.files);

        if (files.length === 0) {
            alert("Please select at least one JSON file.");
            return;
        }

        $('#xmlFirstSelect').addClass('loading');

        const readPromises = files.map(file => {
            return new Promise((resolve, reject) => {
                if (!file.name.toLowerCase().endsWith(".json")) {
                    return reject(`Invalid file type: ${file.name}`);
                }

                const reader = new FileReader();

                reader.onload = () => {
                    try {
                        const data = JSON.parse(reader.result); // JSON text -> JS object/array
                        const fileName = file.name.replace(/\.json$/i, "");

                        console.log(`Successfully loaded file: ${file.name}`);
                        resolve({ fileName, data });
                    } catch (e) {
                        reject(`Error parsing file: ${file.name} (${e.message})`);
                    }
                };

                reader.onerror = () => reject(`Error reading file: ${file.name}`);
                reader.readAsText(file);
            });
        });

        Promise.all(readPromises)
            .then(results => {
                results.sort((a, b) =>
                    a.fileName.localeCompare(b.fileName, undefined, {
                        numeric: true,
                        sensitivity: "base"
                    })
                );

                results.forEach(result => {
                    multiJSONImport[result.fileName] = result.data; // store the parsed object
                    $('#xmlFirstSelect').append(
                        `<option value="${result.fileName}">${result.fileName}</option>`
                    );
                });
            })
            .catch(err => {
                alert(err);
            })
            .finally(() => {
                $('#xmlFirstSelect').removeClass('loading');
            });
    });

<html>
<head>
    <title>KkBm-Checker</title>
    <link rel="stylesheet" href="data/mattStyle.css">
    <script src="https://walm-dc.github.io/WebTools/public/jquery-3.7.1.min.js"></script>
    <script src="https://walm-dc.github.io/WebTools/public/table2csv.js"></script>
    <script src="https://walm-dc.github.io/WebTools/public/ddtf.js"></script>
    <script src="data/mattQuery.js"></script>
    <style>
        .loading {
            background-image: url(loading.gif);
            background-repeat: no-repeat;
            min-height: 600px;
            background-position: center;
            background-size: 600px auto;
        }
        button{
            width: 210px;
            margin-left: 14px;
        }
        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            margin-left: 7px;
        }
        .kkBmli {
            font-weight: bold;
        }
        .l1Highlither {
            color: #ff0000;
        }
        #refreshTimer{
            position: absolute;
            left: 10px;
            color: white;
        }
        #refreshNow{
            cursor: pointer;
            background-color: darkorange;
            padding: 5px 5px;
            border-radius: 5px;
            margin-left: 10px;
            margin-top: 10px;
            line-height: 50px;
            color: black;
        }
        #refreshNow .refresherIcon{
            filter: none;
            width: 16px;
            height: 16px;
            margin-top: -15px;
            vertical-align: middle;
        }
        .div_before_table {
            height: calc(100% - 175px);
        }
        @media(max-width: 1710px){
            .div_before_table {
                height: calc(100% - 235px);
            }
        }
        @media(max-width: 1248px){
            .div_before_table {
                height: calc(100% - 250px);
            }
        }
    </style>
</head>
<body>
    <div id="topDiv"></div>
    <div class="masterDiv">
        <!-- <div class="topDiv">
            <h2>3D-Modell&uuml;bersicht</h2>
        </div> -->
        <div>
            <div class="resultDiv">
                <!-- <div id="refreshTimer"><span id="refreshNow">Daten aktualisieren <img src="refresh-button.png" class="emptySearch refresherIcon"></span></div> -->
                <h3>Anzahl der gefilterten Artikel: <span id="myCounter"></span></h3>
                <h3>Anzahl der Varianten / Absprungpunkte: <span id="myVariantCounter"></span></h3>
                <!-- <h3 class="withButton">CSV Export: 
                    <button id="exportAll" class="pushable">
                        <span class="front">Alle Daten</span>
                    </button>
                    <button id="exportFiltered" class="pushable">
                        <span class="front">Gefilterte Daten</span>
                    </button>
                </h3> -->
                <img src="refresh-button.png" class="emptySearch" title="Suche leeren" alt="Suche leeren"><input type="text" id="myInput" placeholder="Allgemeine Suche auf alle Felder...">
                <div class="div_before_table loading">
                    <table id="myTable" cellspacing="0" cellpadding="0">
                        <tr>
                            <th class="skip-filter">3D Domain</th>
                            <th>Lieferant</th>
                            <th>Modell</th>
                            <th class="skip-filter">Nummer</th>
                            <th>Schiene</th>
                            <th>Land</th>
                            <th>Online</th>
                            <th>Konfig.</th>
                            <th>KkBm 1L</th>
                            <th class="skip-filter">KkBm Liste</th>
                        </tr>
                    </table>
                </div>
            </div>    
        </div>
    </div>
</body>
<script>
    injectTabs();

    var masterData = [], fullProdList = {};
    var intern = 0, extern = 0, today = new Date().getFullYear() + '' + (new Date().getMonth() + 1) + '' + new Date().getDate();
    var combinedRegistry = [];
    var countryShorts = {
        "LU": "xxxlutz",
        "MM": "moemax",
        "MX": "moebelix"
    }
    function countColumns(){
        $('#myCounter').html(($('table tr').length-1)-($('table tr[style="display: none;"]').length));
        var allVarantCount = 0, inactiveVariantCount = 0;
        $.each($('table tr'),function(id, val){
            if(typeof($(val).attr('variants'))!='undefined'){
                allVarantCount += parseInt($(val).attr('variants'));
            }
        })
        $.each($('table tr[style="display: none;"]'),function(id, val){
            if(typeof($(val).attr('variants'))!='undefined'){
                inactiveVariantCount += parseInt($(val).attr('variants'));
            }
        })
        $('#myVariantCounter').html(allVarantCount-inactiveVariantCount);
    }
    $('#myInput').on('keydown', function(e) {
        if (e.which === 13) { // Check if the Enter key is pressed (key code 13)
            if($(this).val() === ""){
                removeHighlights();
                $('#myTable tr').show();
            } else {
                filterTable();
            }
        }
    });
    $('.emptySearch').on('click', function(){
        $('#myInput').val('');
        removeHighlights();
        $('#myTable tr').show();
        countColumns();
    });
    // docu for plugin: https://www.jqueryscript.net/table/jQuery-Plugin-To-Export-Table-Data-To-CSV-File-table2csv.html
    $('#exportAll').on('click',function(){
        $("table").table2csv({  
            filename:'3D-Modellliste.csv',
            separator: ';',
            newline: '\n',
            quoteFields: false,
            trimContent: true,
            excludeHidden: false          
        });
    })
    $('#exportFiltered').on('click',function(){
        $("table").table2csv({
            filename:'3D-Modellliste-gefiltert.csv',
            separator: ';',
            newline: '\n',
            quoteFields: false,
            trimContent: true,
            excludeHidden: true
        });
    })
    function fillResultTable(sortData){
        $.each(sortData, function(id, val){
            $('#myTable').append(
                '<tr><td>'+val.shortDomain+'</td>'+
                '<td>'+val.lieferant+'</td>'+
                '<td>'+val.modell+'</td>'+
                '<td>'+val.prodNumber+'</td>'+
                '<td>'+val.brand+'</td>'+
                '<td>'+val.locale+'</td>'+
                val.online+
                val.konfig+
                val.kkbmTable+
                '<td>'+val.kkbmDate+'</td></tr>'
            )
        })
    }
    function readAndShowJSON(){
        $.getJSON( "list.json", function( data ) {
            fullProdList = data;
            
            $.getJSON( "kkbmArchive.json", function( data ) {
            const cleanedAndSorted = Object.fromEntries(
            Object.entries(data)
                // .map(([key, value]) => [
                //     key.replace(/^XXXL/, ''), // removes XXXL only at the beginning
                //     value
                // ])
                .sort(([keyA], [keyB]) =>
                    keyA.localeCompare(keyB, undefined, {
                        sensitivity: 'base',
                        numeric: true
                    })
                )
            )
            // masterData = cleanedAndSorted;

            $.each(cleanedAndSorted, function(id, val){
                var storeUrl = countryShorts[val.brand]+'.'+val.locale;
                if(countryShorts[val.brand] === 'xxxlutz' && val.locale === 'si'){
                    storeUrl = 'xxxlesnina'+'.'+val.locale;
                }
                var datePattern = /^\d{4}-\d{2}-\d{2}$/;
                var dateEntries = $.map(val, function (value, key) {
                    return datePattern.test(key) ? { date: key, info: value } : null;
                }).sort(function (a, b) {
                    return b.date.localeCompare(a.date);
                });
                var kkbmDate = '', kkbmTable = '<td></td>', latestKkBmDate = '';
                $.each(dateEntries, function(dId, dVal){
                    var auslaufVarianten = '', KkBmL1 = false;
                    var list1L = '', listRef = '', listRest = '';
                    if(latestKkBmDate === ''){
                        latestKkBmDate = dVal.date;
                    }
                    $.each(dVal.info.KkBm, function(index, value){
                        var isL1 = '', kkBmRef = index.trim();
                        var tempList = value.sort((a, b) => {
                            const numA = parseInt(a.replace(/\D/g, ''), 10) || 0;
                            const numB = parseInt(b.replace(/\D/g, ''), 10) || 0;
                            return numA - numB;
                        });
                        if(kkBmRef === '1L'){
                            isL1 = 'l1Highlither';
                            if(!KkBmL1){
                                kkbmTable = '<td class="falseCol">1L</td>'; 
                                KkBmL1 = true;
                            }
                            list1L += '<li><span class="kkBmli l1Highlither">' + kkBmRef + '</span>: ' + tempList.join('/ ') + '</li>';
                        } else if(kkBmRef === ''){
                            kkBmRef = 'REF';
                            listRef += '<li><span class="kkBmli">' + kkBmRef + '</span>: ' + tempList.join('/ ') + '</li>';
                        } else {
                            listRest += '<li><span class="kkBmli">' + kkBmRef + '</span>: ' + tempList.join('/ ') + '</li>';
                        }
                    })
                    auslaufVarianten += list1L + listRest + listRef;
                    var dateColor = 'blue';
                    if(KkBmL1){
                        dateColor = 'red';
                    }
                    kkbmDate += '<b style="color: '+dateColor+';">' + dVal.date + '</b>:<br><ul>' + auslaufVarianten + '</ul>';
                })
                var online = '<td class="trueCol">Ja</td>';
                if(!fullProdList[id].online){online = '<td class="falseCol">Nein</td>'}
                if(fullProdList[id].online===''){online = '<td></td>'}

                var konfig = '<td class="trueCol">Ja</td>';
                if(!fullProdList[id].konfig){konfig = '<td class="falseCol">Nein</td>'}
                if(fullProdList[id].konfig===''){konfig = '<td></td>'}

                var entry = {
                    domain: id,
                    shortDomain: id.replace('XXXL', ''),
                    lieferant: id.split('.')[0],
                    modell: id.split('.')[1].split('@')[0],
                    prodNumber: '<a href="https://'+storeUrl+'/s/?s='+val.productNumber+'" target="_blank">'+val.productNumber+'</a>',
                    online: online,
                    konfig: konfig,
                    brand: val.brand,
                    locale: val.locale,
                    kkbmTable: kkbmTable,
                    kkbmDate: kkbmDate,
                    latestUpdate: latestKkBmDate
                }
                masterData.push(entry);
            })
            var sortedMasterData = $.map(masterData, function (entry) {
                return entry;
            }).sort(function (a, b) {
                return (b.latestUpdate || '').localeCompare(a.latestUpdate || '');
            });
            fillResultTable(sortedMasterData);
            $('.loading').removeClass('loading');
            countColumns()
            jQuery('#myTable').ddTableFilter();
        })});
    }
    readAndShowJSON();    

</script>
</html>
